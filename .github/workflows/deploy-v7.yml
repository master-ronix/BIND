name: Build v9.1 and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
           python-version: '3.12'

      - name: Install Pillow
        run: pip install Pillow

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
           node-version: '22'

      - name: Apply v9 CSS enhancements
        run: python scripts/build_css_v9.py
        env:
           REPO_PATH: .

      - name: Apply v9 JS enhancements
        run: python scripts/build_js_v9.py
        env:
           REPO_PATH: .

      - name: Apply v9 HTML enhancements
        run: python scripts/build_html_v9.py
        env:
           REPO_PATH: .

      - name: Apply v9.1 hotfix (breadcrumb dedup + review-wall fix)
        run: python scripts/hotfix_v91.py
        env:
           REPO_PATH: .

      - name: Generate brand assets
        run: python scripts/build_brand_assets.py
        env:
           REPO_PATH: .
        continue-on-error: true

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "v9.1: hotfix breadcrumb duplication, review-wall overflow, data-table responsive"
          git pull --rebase origin main || true
          git push || { git pull --rebase origin main && git push; }

      - name: Deploy to Cloudflare
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5c4d31eb0bfbca08d85eba928fa529f1
