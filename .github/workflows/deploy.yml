name: Deploy to Cloudflare Workers

on:
  push:
    branches: [website]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and apply visual fixes from release zip
        run: |
          ZIP_URL="https://github.com/master-ronix/BIND/releases/download/visual-fixes-v1/BIND-codebase-fixed.zip"
          echo "Downloading visual fixes zip from release..."
          curl -L -o /tmp/codebase.zip "$ZIP_URL" || echo "Zip download failed, continuing with existing files"
          if [ -f /tmp/codebase.zip ]; then
            mkdir -p /tmp/extracted
            unzip -o /tmp/codebase.zip -d /tmp/extracted
            EXTRACTED_DIR=$(find /tmp/extracted -maxdepth 1 -type d | tail -1)
            echo "Extracted to: $EXTRACTED_DIR"
            if [ -d "$EXTRACTED_DIR/site" ]; then
              cp -f $EXTRACTED_DIR/site/index.html site/index.html || true
              cp -f $EXTRACTED_DIR/site/events.html site/events.html || true
              cp -f $EXTRACTED_DIR/site/our-story.html site/our-story.html || true
              cp -f $EXTRACTED_DIR/site/community.html site/community.html || true
              cp -f $EXTRACTED_DIR/site/achievements.html site/achievements.html || true
              cp -f $EXTRACTED_DIR/site/safety.html site/safety.html || true
              cp -f $EXTRACTED_DIR/site/join.html site/join.html || true
              cp -f $EXTRACTED_DIR/site/store.html site/store.html || true
              cp -f $EXTRACTED_DIR/site/contact.html site/contact.html || true
              mkdir -p site/assets/css
              cp -f $EXTRACTED_DIR/site/assets/css/style.css site/assets/css/style.css || true
              echo "Visual fixes applied successfully"
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update HTML files to use clean URLs
        run: python3 scripts/update_clean_urls.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Deploy Worker
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
